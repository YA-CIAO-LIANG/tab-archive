<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <div>
        <div class="eyebrow">Tab Archive</div>
        <h1>網頁集合器</h1>
      </div>
    </header>

    <section id="main" hidden>
      <p class="count" id="count"></p>
      <label class="check"
        ><input type="checkbox" id="onlyWindow" /> 只收這個視窗</label
      >
      <label class="check"
        ><input type="checkbox" id="close" /> 收藏後關閉分頁（不含釘選）</label
      >
      <button class="btn primary" id="capture">收藏所有分頁</button>
      <p class="msg" id="msg" role="status"></p>
      <nav>
        <a href="#" id="open">開啟典藏</a><a href="#" id="settings">設定</a>
      </nav>
    </section>

    <section id="setup" hidden>
      <p class="hint">在網頁集合器的「帳號」頁可以找到網站網址與收藏金鑰。</p>
      <label class="field"
        >網站網址<input id="site" placeholder="https://…" autocomplete="off"
      /></label>
      <label class="field"
        >收藏金鑰<input id="token" placeholder="tab_…" autocomplete="off"
      /></label>
      <button class="btn primary" id="save">儲存</button>
      <p class="msg" id="setupMsg"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
